# Self-contained dev stack: app, queue worker, scheduler, Vite and Postgres (all Alpine).
# Machine-specific tweaks (shared networks, DNS, tunnels) belong in docker-compose.override.yml (git-ignored).

x-app: &app
  build: .
  volumes:
    - .:/var/www/html
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"

  queue:
    <<: *app
    command: php artisan queue:work --timeout=60

  scheduler:
    <<: *app
    command: php artisan schedule:work

  vite:
    <<: *app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promptedit
      POSTGRES_USER: promptedit
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptedit"]
      interval: 3s
      retries: 10

volumes:
  pgdata:
